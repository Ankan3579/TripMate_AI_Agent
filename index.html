<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TripMate AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --navy-950:#060c18;
    --navy-900:#0a1628;
    --navy-850:#0d1c33;
    --navy-800:#111f3c;
    --navy-700:#1c2f52;
    --navy-600:#2a4270;
    --teal-400:#2dd4bf;
    --teal-300:#7ee8d8;
    --teal-glow:rgba(45,212,191,0.35);
    --amber-400:#f5b942;
    --rose-400:#fb7185;
    --ink-100:#eaf0fa;
    --ink-300:#c2cede;
    --ink-500:#8a9bbd;
    --ink-600:#5f7093;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(45,212,191,0.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(245,185,66,0.05), transparent 40%),
      var(--navy-950);
    color:var(--ink-100);
    font-family:var(--font-body);
    min-height:100vh;
  }

  ::selection{ background:var(--teal-glow); color:var(--ink-100); }

  a{ color:var(--teal-300); }

  .app{
    max-width:900px;
    margin:0 auto;
    padding:40px 20px 80px;
  }

  /* ---------- header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:36px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:42px; height:42px;
    border-radius:11px;
    background:linear-gradient(155deg, var(--teal-400), #1a8f80);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow:0 6px 20px -6px var(--teal-glow);
    flex-shrink:0;
  }
  .brand-text h1{
    font-family:var(--font-display);
    font-size:20px;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--ink-500);
    font-family:var(--font-mono);
    letter-spacing:0.3px;
  }
  .status-pill{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:11.5px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--navy-700);
    background:var(--navy-850);
    color:var(--ink-500);
    text-transform:uppercase;
    letter-spacing:0.6px;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink-600);
  }
  .status-dot.online{ background:var(--teal-400); box-shadow:0 0 8px var(--teal-glow); }
  .status-dot.offline{ background:var(--rose-400); box-shadow:0 0 8px rgba(251,113,133,0.4); }
  .status-dot.checking{ background:var(--amber-400); animation:pulse 1.2s infinite; }

  @keyframes pulse{
    0%,100%{ opacity:1; } 50%{ opacity:0.35; }
  }

  /* ---------- boarding pass card ---------- */
  .pass{
    position:relative;
    background:linear-gradient(180deg, var(--navy-850), var(--navy-900));
    border:1px solid var(--navy-700);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .pass-top{
    padding:26px 28px 22px;
  }
  .pass-eyebrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  .pass-eyebrow .tag{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--teal-300);
    text-transform:uppercase;
  }
  .pass-eyebrow .code{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-600);
    letter-spacing:1px;
  }

  .route-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:14px;
    align-items:end;
    margin-bottom:22px;
  }
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--ink-500);
    margin-bottom:7px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--navy-800);
    border:1px solid var(--navy-700);
    border-radius:10px;
    padding:11px 12px;
    color:var(--ink-100);
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    letter-spacing:0.3px;
    outline:none;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .field input::placeholder, .field textarea::placeholder{
    color:var(--ink-600);
    font-weight:500;
  }
  .field input:focus, .field textarea:focus{
    border-color:var(--teal-400);
    box-shadow:0 0 0 3px var(--teal-glow);
  }
  .plane-divider{
    font-size:17px;
    color:var(--teal-400);
    padding-bottom:11px;
    text-align:center;
  }

  .grid-4{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-bottom:6px;
  }
  @media (max-width:640px){
    .grid-4{ grid-template-columns:repeat(2, 1fr); }
    .route-row{ grid-template-columns:1fr; }
    .plane-divider{ display:none; }
  }
  .field.small input{
    font-size:13.5px;
    font-family:var(--font-mono);
    font-weight:500;
  }

  /* perforation */
  .perforation{
    position:relative;
    height:0;
    border-top:1.5px dashed var(--navy-600);
    margin:6px 0 0;
  }
  .perforation::before, .perforation::after{
    content:'';
    position:absolute;
    top:-11px;
    width:22px; height:22px;
    background:var(--navy-950);
    border-radius:50%;
  }
  .perforation::before{ left:-39px; }
  .perforation::after{ right:-39px; }

  .pass-bottom{
    padding:22px 28px 26px;
  }
  .pass-bottom label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--ink-500);
    margin-bottom:9px;
  }
  .pass-bottom textarea{
    min-height:78px;
    resize:vertical;
    font-family:var(--font-body);
    font-size:14.5px;
    font-weight:400;
    line-height:1.5;
  }

  .submit-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    gap:14px;
    flex-wrap:wrap;
  }
  .hint{
    font-size:12px;
    color:var(--ink-600);
  }
  .fly-btn{
    background:linear-gradient(155deg, var(--teal-400), #1a8f80);
    border:none;
    color:var(--navy-950);
    font-family:var(--font-display);
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.3px;
    padding:13px 24px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 10px 24px -8px var(--teal-glow);
    transition:transform 0.12s, box-shadow 0.12s;
    white-space:nowrap;
  }
  .fly-btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 14px 30px -8px var(--teal-glow); }
  .fly-btn:active:not(:disabled){ transform:translateY(0); }
  .fly-btn:disabled{ opacity:0.55; cursor:not-allowed; }

  .error-banner{
    margin-top:16px;
    background:rgba(251,113,133,0.08);
    border:1px solid rgba(251,113,133,0.3);
    color:#ffb4c0;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    font-family:var(--font-mono);
  }

  /* ---------- agent status board ---------- */
  .board{
    margin-top:28px;
  }
  .board-title{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-500);
    margin:0 0 12px 2px;
  }
  .board-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }
  @media (max-width:640px){
    .board-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .agent-card{
    background:var(--navy-850);
    border:1px solid var(--navy-700);
    border-radius:12px;
    padding:16px 14px;
    text-align:center;
    transition:border-color 0.25s, background 0.25s;
  }
  .agent-card .icon{ font-size:22px; margin-bottom:8px; display:block; }
  .agent-card .name{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--ink-500);
  }
  .agent-card .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--ink-600);
    margin:10px auto 0;
  }
  .agent-card.active{
    border-color:var(--teal-400);
    background:linear-gradient(180deg, rgba(45,212,191,0.08), var(--navy-850));
  }
  .agent-card.active .dot{ background:var(--amber-400); animation:pulse 0.9s infinite; }
  .agent-card.done .dot{ background:var(--teal-400); box-shadow:0 0 8px var(--teal-glow); }
  .agent-card.done .name{ color:var(--ink-300); }

  /* ---------- result ---------- */
  .result{
    margin-top:28px;
    background:linear-gradient(180deg, var(--navy-850), var(--navy-900));
    border:1px solid var(--navy-700);
    border-radius:16px;
    padding:24px 26px;
  }
  .result-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .result-head .stamp{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--navy-950);
    background:var(--teal-400);
    padding:4px 9px;
    border-radius:6px;
  }
  .result-head h3{
    font-family:var(--font-display);
    font-size:16px;
    margin:0;
  }
  .result-body{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-300);
    white-space:pre-wrap;
  }
  .barcode{
    margin-top:20px;
    height:26px;
    background:repeating-linear-gradient(90deg,
      var(--ink-600) 0px, var(--ink-600) 2px,
      transparent 2px, transparent 5px,
      var(--ink-600) 5px, var(--ink-600) 6px,
      transparent 6px, transparent 10px);
    opacity:0.35;
    border-radius:3px;
  }

  /* ---------- history ---------- */
  .history{
    margin-top:32px;
  }
  .history-header{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
    margin-bottom: 4px;
  }
  .history-header:hover .board-title{ color:var(--ink-300); }
  .chevron{
    color:var(--ink-500);
    font-size:12px;
    transition:transform 0.2s;
  }
  .chevron.open{ transform:rotate(90deg); }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
  }
  .history-item{
    background:var(--navy-850);
    border:1px solid var(--navy-700);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color 0.15s;
  }
  .history-item:hover{ border-color:var(--navy-600); }
  .history-item .route{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--teal-300);
    margin-bottom:4px;
  }
  .history-item .query{
    font-size:13px;
    color:var(--ink-500);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .empty-history{
    font-size:13px;
    color:var(--ink-600);
    padding:10px 2px;
  }

  footer{
    text-align:center;
    margin-top:50px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--navy-600);
    letter-spacing:0.4px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const API_URL = "http://127.0.0.1:8000";

const AGENTS = [
  { key: "flight_result",    name: "Flight Agent",    icon: "\u2708\uFE0F" },
  { key: "hotel_result",     name: "Hotel Agent",      icon: "\uD83C\uDFE8" },
  { key: "itinerary_result", name: "Itinerary Agent",  icon: "\uD83D\uDDFA\uFE0F" },
  { key: "memory_result",    name: "Memory Agent",     icon: "\uD83E\uDDE0" },
];

function StatusPill({ status }) {
  const label = status === "online" ? "API connected" : status === "offline" ? "API offline" : "Checking API";
  return (
    <div className="status-pill">
      <span className={"status-dot " + status}></span>
      {label}
    </div>
  );
}

function AgentBoard({ activeStage, done }) {
  return (
    <div className="board">
      <p className="board-title">Agent pipeline</p>
      <div className="board-grid">
        {AGENTS.map((agent, i) => {
          const isActive = !done && activeStage === i;
          const isDone = done || activeStage > i;
          return (
            <div key={agent.key} className={"agent-card" + (isActive ? " active" : "") + (isDone ? " done" : "")}>
              <span className="icon">{agent.icon}</span>
              <div className="name">{agent.name}</div>
              <div className="dot"></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [form, setForm] = useState({
    user_query: "",
    origin: "",
    destination: "",
    start_date: "",
    end_date: "",
    budget: "",
    travelers: 1,
  });
  const [apiStatus, setApiStatus] = useState("checking");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [stage, setStage] = useState(0);
  const [history, setHistory] = useState([]);
  const [historyOpen, setHistoryOpen] = useState(true);
  const stageTimer = useRef(null);

  useEffect(() => {
    fetch(API_URL + "/")
      .then((r) => (r.ok ? setApiStatus("online") : setApiStatus("offline")))
      .catch(() => setApiStatus("offline"));
  }, []);

  const update = (key) => (e) => {
    const value = key === "travelers" ? Number(e.target.value) : e.target.value;
    setForm((f) => ({ ...f, [key]: value }));
  };

  const startStageSimulation = () => {
    setStage(0);
    let i = 0;
    stageTimer.current = setInterval(() => {
      i += 1;
      if (i < AGENTS.length) setStage(i);
    }, 650);
  };

  const stopStageSimulation = () => {
    if (stageTimer.current) clearInterval(stageTimer.current);
    stageTimer.current = null;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.user_query.trim()) {
      setError("Tell TripMate what you need before you take off.");
      return;
    }
    setError(null);
    setResult(null);
    setLoading(true);
    startStageSimulation();

    try {
      const res = await fetch(API_URL + "/trip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || "Request failed with status " + res.status);
      }
      stopStageSimulation();
      setStage(AGENTS.length);
      setResult(data);
      setHistory((h) => [
        { ...form, response: data.response, ts: new Date().toLocaleTimeString() },
        ...h,
      ].slice(0, 12));
    } catch (err) {
      stopStageSimulation();
      setStage(0);
      setError(err.message || "Couldn't reach TripMate. Is the FastAPI server running?");
    } finally {
      setLoading(false);
    }
  };

  const loadFromHistory = (item) => {
    setForm({
      user_query: item.user_query,
      origin: item.origin,
      destination: item.destination,
      start_date: item.start_date,
      end_date: item.end_date,
      budget: item.budget,
      travelers: item.travelers,
    });
    setResult({ response: item.response, success: true });
    setStage(AGENTS.length);
  };

  return (
    <div className="app">
      <div className="header">
        <div className="brand">
          <div className="brand-mark">\u2708\uFE0F</div>
          <div className="brand-text">
            <h1>TripMate AI Agent</h1>
            <p>MULTI-AGENT TRIP PLANNER</p>
          </div>
        </div>
        <StatusPill status={apiStatus} />
      </div>

      <form className="pass" onSubmit={handleSubmit}>
        <div className="pass-top">
          <div className="pass-eyebrow">
            <span className="tag">Boarding Pass &middot; Trip Request</span>
            <span className="code">TM-{String(history.length + 1).padStart(3, "0")}</span>
          </div>

          <div className="route-row">
            <div className="field">
              <label>From</label>
              <input
                type="text"
                placeholder="Origin city"
                value={form.origin}
                onChange={update("origin")}
              />
            </div>
            <div className="plane-divider">\u2708\uFE0F</div>
            <div className="field">
              <label>To</label>
              <input
                type="text"
                placeholder="Destination city"
                value={form.destination}
                onChange={update("destination")}
              />
            </div>
          </div>

          <div className="grid-4">
            <div className="field small">
              <label>Depart</label>
              <input type="date" value={form.start_date} onChange={update("start_date")} />
            </div>
            <div className="field small">
              <label>Return</label>
              <input type="date" value={form.end_date} onChange={update("end_date")} />
            </div>
            <div className="field small">
              <label>Passengers</label>
              <input type="number" min="1" value={form.travelers} onChange={update("travelers")} />
            </div>
            <div className="field small">
              <label>Budget</label>
              <input type="text" placeholder="e.g. 50000" value={form.budget} onChange={update("budget")} />
            </div>
          </div>
        </div>

        <div className="perforation"></div>

        <div className="pass-bottom">
          <label>Tell TripMate what you need</label>
          <textarea
            placeholder="e.g. Plan a relaxed 5-day trip with mid-range hotels and 2 must-see landmarks per day..."
            value={form.user_query}
            onChange={update("user_query")}
          />

          <div className="submit-row">
            <span className="hint">Calls POST {API_URL}/trip</span>
            <button className="fly-btn" type="submit" disabled={loading}>
              {loading ? "Planning\u2026" : "Plan Trip \u2192"}
            </button>
          </div>

          {error && <div className="error-banner">{error}</div>}
        </div>
      </form>

      {(loading || result) && (
        <AgentBoard activeStage={stage} done={!loading && !!result} />
      )}

      {result && (
        <div className="result">
          <div className="result-head">
            <span className="stamp">Confirmed</span>
            <h3>Your Trip Plan</h3>
          </div>
          <div className="result-body">{result.response}</div>
          <div className="barcode"></div>
        </div>
      )}

      <div className="history">
        <div className="history-header" onClick={() => setHistoryOpen((o) => !o)}>
          <p className="board-title">Session history ({history.length})</p>
          <span className={"chevron" + (historyOpen ? " open" : "")}>&#9656;</span>
        </div>
        {historyOpen && (
          <div className="history-list">
            {history.length === 0 && (
              <div className="empty-history">Your planned trips will show up here.</div>
            )}
            {history.map((item, idx) => (
              <div className="history-item" key={idx} onClick={() => loadFromHistory(item)}>
                <div className="route">
                  {(item.origin || "Anywhere")} \u2192 {(item.destination || "Anywhere")} &middot; {item.ts}
                </div>
                <div className="query">{item.user_query}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      <footer>TRIPMATE AI &middot; SESSION LOCAL &middot; NOT STORED SERVER-SIDE</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
